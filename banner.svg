<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Bump for DrakesCraft</title><desc id="desc">Animated appraisal-themed banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071813"/><stop offset=".55" stop-color="#13253a"/><stop offset="1" stop-color="#281437"/></linearGradient>
    <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#66e6a5"/><stop offset=".48" stop-color="#e7c65d"/><stop offset="1" stop-color="#a66cff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <path d="M0 265 Q220 210 430 260 T840 245 T1200 250 V320 H0Z" fill="#0c3327" opacity=".9"/>
  <g fill="none" stroke="#d6bd64" opacity=".32"><path d="M38 42h1124M38 278h1124"/><path d="M62 58v204M1138 58v204"/></g>
