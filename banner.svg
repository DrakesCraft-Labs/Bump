    <path d="M-62 14h124" stroke="#f4df8a" stroke-width="8" stroke-linecap="round"/>
    <circle r="5" fill="#fff4ba"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Georgia,serif">
