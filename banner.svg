    <text x="300" y="195" fill="#69dfa2" font-size="27" font-family="Arial,sans-serif" font-weight="700">APPRAISAL · ATTRIBUTES · 1.21.11</text>
    <text x="300" y="232" fill="#cbd8d0" font-size="21" font-family="Arial,sans-serif">Maintained for the DrakesCraft Slimefun ecosystem</text>
