# DO NOT modify this
version: 4

options:
  # Auto update
  # Drake builds are deployed only after compatibility validation.
  auto-update: false
  # Language shipped and supported by the Drake build.
  lang: es-ES
  # Enable researches
  enable-researches: true

weapons:
  # The duration of projectiles launched by any Bump weapon (in Slimefun ticks)
  projectile-duration: 10

# Appraise system
appraise:
  # The thresholds of stars (appraise result levels).
  # The star is determined by the calculation of overall appraise result.
  stars:
    100: 20
    98: 10
    96: 9
    92: 8
    88: 7
    82: 6
    74: 5
    64: 4
    48: 3
    30: 2
    10: 1
